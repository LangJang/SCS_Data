# SCS Marine Data Tool — Dataset Registry
# Each dataset entry defines metadata for data discovery and plot configuration.

datasets:
  # ===========================================================================
  # Standardized datasets — unified 14 depth levels (0–400 m), 0.05° grid
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Standardized ROMS
  # ---------------------------------------------------------------------------
  - name: "SCSIO Standardized (0–400 m, 0.05°)"
    # hidden: true
    source: "SCSIO-Standard"
    keywords:
      - temperature
      - salinity
      - current
      - velocity
      - scsio
      - standardized
      - depth-level
    variables:
      - temperature
      - salinity
      - u_current
      - v_current
      - w_velocity
    resolution:
      default: 0.05
      available: [0.05, 0.1, 0.25]
    spatial:
      lon: { min: 90.12, max: 133.78 }
      lat: { min: 0.80, max: 30.38 }
    temporal:
      start: 2023-01-01
      end: 2023-01-31
      frequency: daily
    vertical:
      type: depth
      layers: 14
      depth_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 200, 250, 300, 350, 400]
    path: "D:/ChatWithAI/Downloading_CEMES/output/roms/"
    file_pattern: "roms_avg_*.nc"

  - name: "SCSIO Rectilinear (0–400 m, 0.05°)"
    source: "SCSIO-Rectilinear"
    keywords:
      - temperature
      - salinity
      - current
      - scsio
      - rectilinear
      - regridded
      - standardized
    variables:
      - temperature
      - salinity
      - u_current
      - v_current
      - w_velocity
    resolution:
      default: 0.05
      available: [0.05, 0.1, 0.25]
    spatial:
      lon: { min: 90.25, max: 133.80 }
      lat: { min: 1.00, max: 30.25 }
    temporal:
      start: 2023-01-01
      end: 2023-01-31
      frequency: daily
    vertical:
      type: depth
      layers: 14
      depth_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 200, 250, 300, 350, 400]
    path: "D:/ChatWithAI/Downloading_CEMES/output/roms/"
    file_pattern: "roms_rectilinear_005deg.nc"

  # ---------------------------------------------------------------------------
  # Standardized CMEMS
  # ---------------------------------------------------------------------------
  - name: "CMEMS Standardized — DO & Chlorophyll (0–400 m, 0.05°)"
    source: "CMEMS"
    keywords:
      - chlorophyll
      - oxygen
      - dissolved oxygen
      - cmems
      - standardized
      - depth-level
    variables:
      - chlorophyll
      - dissolved_oxygen
    resolution:
      default: 0.05
      available: [0.05, 0.1, 0.25]
    spatial:
      lon: { min: 90.0, max: 134.5 }
      lat: { min: -0.5, max: 30.0 }
    temporal:
      start: 2023-01-01
      end: 2023-12-31
      frequency: daily
    vertical:
      type: depth
      layers: 14
      depth_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 200, 250, 300, 350, 400]
    path: "D:/ChatWithAI/Downloading_CEMES/output/"
    file_pattern: "SCS_cmems_do_chl.nc"

  - name: "CMEMS Standardized — Nutrients (0–400 m, 0.05°)"
    source: "CMEMS"
    keywords:
      - nitrate
      - phosphate
      - silicate
      - nutrient
      - cmems
      - standardized
      - depth-level
    variables:
      - nitrate
      - phosphate
      - silicate
    resolution:
      default: 0.05
      available: [0.05, 0.1, 0.25]
    spatial:
      lon: { min: 90.0, max: 134.5 }
      lat: { min: -0.5, max: 30.0 }
    temporal:
      start: 2023-01-01
      end: 2023-12-31
      frequency: daily
    vertical:
      type: depth
      layers: 14
      depth_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 200, 250, 300, 350, 400]
    path: "D:/ChatWithAI/Downloading_CEMES/output/"
    file_pattern: "SCS_cmems_no3_po4_si.nc"

  - name: "CMEMS Standardized — pH (0–400 m, 0.05°)"
    source: "CMEMS"
    keywords:
      - ph
      - acidity
      - cmems
      - standardized
      - depth-level
    variables:
      - ph
    resolution:
      default: 0.05
      available: [0.05, 0.1, 0.25]
    spatial:
      lon: { min: 90.0, max: 134.5 }
      lat: { min: -0.5, max: 30.0 }
    temporal:
      start: 2023-01-01
      end: 2023-12-31
      frequency: daily
    vertical:
      type: depth
      layers: 14
      depth_values: [0, 20, 40, 60, 80, 100, 120, 140, 160, 200, 250, 300, 350, 400]
    path: "D:/ChatWithAI/Downloading_CEMES/output/"
    file_pattern: "SCS_cmems_ph.nc"

  # ===========================================================================
  # Original (raw) datasets — kept for backward reference
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # SCSIO (original sigma-coordinate)
  # ---------------------------------------------------------------------------
  - name: "SCSIO SCS Daily Average (raw sigma)"
    hidden: true
    source: "SCSIO"
    keywords:
      - temperature
      - salinity
      - current
      - velocity
      - sea surface height
      - scsio
      - daily
    variables:
      - temperature
      - salinity
      - u_current
      - v_current
      - w_velocity
      - sea_surface_height
      - u_barotropic
      - v_barotropic
    resolution:
      default: 0.05
      available: [0.05, 0.1, 0.25, 0.5]
    spatial:
      lon: { min: 90.12, max: 133.78 }
      lat: { min: 0.80, max: 30.38 }
    temporal:
      start: 2023-01-01
      end: 2023-01-31
      frequency: daily
    vertical:
      type: sigma
      layers: 45
    path: "data/"
    file_pattern: "roms_avg_*.nc"

  # ---------------------------------------------------------------------------
  # CMEMS — Biogeochemical
  # ---------------------------------------------------------------------------
  - name: "CMEMS Dissolved Oxygen & Chlorophyll"
    hidden: true
    source: "CMEMS"
    keywords:
      - chlorophyll
      - oxygen
      - dissolved oxygen
      - cmems
      - biogeochemical
    variables:
      - chlorophyll
      - dissolved_oxygen
    resolution:
      default: 0.25
      available: [0.25, 0.5]
    spatial:
      lon: { min: 90.0, max: 134.5 }
      lat: { min: -0.5, max: 30.0 }
    temporal:
      start: 2023-01-01
      end: 2025-12-31
      frequency: daily
    vertical:
      type: depth
      layers: 75
      range: [0.5, 5902.1]
    path: "D:/ChatWithAI/Downloading_CEMES/"
    file_pattern: "SCS_BGC_DO_CHL_2025.nc"

  - name: "CMEMS Nitrate, Phosphate & Silicate"
    hidden: true
    source: "CMEMS"
    keywords:
      - nitrate
      - phosphate
      - silicate
      - nutrient
      - cmems
      - biogeochemical
    variables:
      - nitrate
      - phosphate
      - silicate
    resolution:
      default: 0.25
      available: [0.25, 0.5]
    spatial:
      lon: { min: 90.0, max: 134.5 }
      lat: { min: -0.5, max: 30.0 }
    temporal:
      start: 2023-01-01
      end: 2025-12-31
      frequency: daily
    vertical:
      type: depth
      layers: 75
      range: [0.5, 5902.1]
    path: "D:/ChatWithAI/Downloading_CEMES/"
    file_pattern: "SCS_BGC_no3_po4_si_2023-2025.nc"

  - name: "CMEMS pH"
    hidden: true
    source: "CMEMS"
    keywords:
      - ph
      - acidity
      - cmems
      - biogeochemical
    variables:
      - ph
    resolution:
      default: 0.25
      available: [0.25, 0.5]
    spatial:
      lon: { min: 90.0, max: 134.5 }
      lat: { min: -0.5, max: 30.0 }
    temporal:
      start: 2023-01-01
      end: 2025-12-31
      frequency: daily
    vertical:
      type: depth
      layers: 50
      range: [0.5, 5727.9]
    path: "D:/ChatWithAI/Downloading_CEMES/"
    file_pattern: "SCS_BGC_PH_2023-2025.nc"

# ---------------------------------------------------------------------------
# Preset regions for quick spatial selection
# ---------------------------------------------------------------------------
preset_regions:
  - name: "Original range"
    north: 30.0
    south: -0.5
    east: 134.5
    west: 90.0
  - name: "South China Sea"
    north: 25.0
    south: -0.5
    east: 122.0
    west: 99.0
  - name: "Northern SCS"
    north: 25.0
    south: 16.0
    east: 122.0
    west: 105.0
  - name: "Nansha (Spratly)"
    north: 12.0
    south: 3.0
    east: 118.0
    west: 108.0
  - name: "Xisha (Paracel)"
    north: 18.0
    south: 15.0
    east: 113.0
    west: 110.0
  - name: "Beibu Gulf"
    north: 22.0
    south: 17.0
    east: 110.0
    west: 105.0

# ---------------------------------------------------------------------------
# Color styles
# ---------------------------------------------------------------------------
color_styles:
  - viridis
  - plasma
  - inferno
  - turbo
  - Spectral_r
  - RdYlBu_r
  - coolwarm
  - Greens
  - Blues

# ---------------------------------------------------------------------------
# Overlay datasets — point / station data for map overlay
# ---------------------------------------------------------------------------
overlays:
  # ---- Fishery (point scatter / pie) ----
  - label: "Beibu Gulf Fishery"
    path: "data/beibu_fishery_sample.csv"
    type: fishery
    summary: "86 stations in Beibu Gulf (17.5-21.5°N, 105.5-109.5°E). 7 species, 5 gear types. Catch range: 10-8,000 kg."
    keywords: [fishery, catch, beibu, fishing, trawl, gillnet, longline, purse seine, beibu gulf]

  - label: "Northern SCS Fishery"
    path: "data/northern_scs_fishery.csv"
    type: fishery
    summary: "95 stations in northern SCS (18-22°N, 110-118°E). 7 species, multi-gear. Catch range: 10-8,000 kg."
    keywords: [fishery, northern, scs, trawl, handline, mackerel, snapper]

  - label: "Nansha (Spratly) Fishery"
    path: "data/nansha_fishery.csv"
    type: fishery
    summary: "65 stations in Nansha area (3-12°N, 108-118°E). 7 species, multi-gear. Catch range: 10-8,000 kg."
    keywords: [fishery, nansha, spratly, southern, barramundi, snapper]

  - label: "Xisha (Paracel) Fishery"
    path: "data/xisha_fishery.csv"
    type: fishery
    summary: "45 stations near Xisha (15-18°N, 110-113°E). 6 species, multi-gear. Catch range: 10-8,000 kg."
    keywords: [fishery, xisha, paracel, central, squid, grouper]

  # ---- Biological survey (station point + detail panel) ----
  - label: "Tuna Survey (SCS-01)"
    path: "D:/ChatWithAI/SCS_data/data/tuna_202606.xlsx"
    type: station
    station_lat: 11.2
    station_lon: 114.0
    station_name: "SCS-01"
    summary: "SCS-01 (11.2°N, 114.0°E). 10 Thunnus albacares specimens. Morphometric measurements: body length, total length, weight, sex."
    keywords: [tuna, biological, survey, morphometric, station, thunnus]
